version: "3.9"

services:
  backend:
    build: ./backend
    container_name: weatherwatch-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app            # hot-reload during dev
      - weatherwatch-db:/app/data # persist SQLite DB
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: weatherwatch-ui
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  weatherwatch-db:
