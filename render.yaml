services:
  - type: web
    name: weatherwatch-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false # Set this in Render dashboard to your Supabase PostgreSQL connection URI
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
